[project]
name = "telegram-latex-assistant"
version = "0.1.0"
description = "Bot Telegram che converte testo in italiano naturale in un PDF LaTeX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# La radice non è un pacchetto da installare: raccoglie il workspace e gli strumenti di sviluppo.
[tool.uv]
package = false

[tool.uv.workspace]
members = []

# Strumenti usati solo in sviluppo e nei test. I test stanno fuori dalle componenti,
# quindi il gruppo dev vive qui nella radice.
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# importlib permette file di test con lo stesso nome in cartelle di componenti diverse
addopts = "--import-mode=importlib --cov --cov-report=term-missing"

# Coverage covers every Python file in the repo (so new components are measured automatically),
# except the tests themselves. The pipeline fails below 90%.
[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade, SIM: simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ty.environment]
python-version = "3.11"
