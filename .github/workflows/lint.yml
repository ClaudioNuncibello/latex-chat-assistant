name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # --locked: fails if uv.lock is out of date with the pyproject.toml files
      # --all-packages: installs every workspace component, not only the root
      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check --diff .

      - name: Type check with ty
        run: uv run ty check
