name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # --locked: fails if uv.lock is out of date with the pyproject.toml files
      # --all-packages: installs every workspace component, not only the root
      - name: Install dependencies
        run: uv sync --all-packages --locked

      # The folder to test is `testpaths` in the root pyproject.toml (tests/unit).
      # pytest exits with code 5 when it collects no tests, so a wrong `testpaths`
      # turns the check red instead of passing silently.
      - name: Run unit tests
        run: uv run pytest
